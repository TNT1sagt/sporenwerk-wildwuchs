name: Build Sporenwerk 1.69.0 for Forge 1.20.1

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: sporenwerk-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout workflow and polish scripts
        uses: actions/checkout@v4

      - name: Download initial Sporenwerk source snapshot
        env:
          SOURCE_ZIP_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3J3eAXO0JHxk99nxUaTru8I5NJp/0b4b8767-5e8f-4950-9492-a656af59a87e.zip
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_ZIP_URL" --output /tmp/sporenwerk-source.zip
          unzip -t /tmp/sporenwerk-source.zip
          mkdir source
          unzip -q /tmp/sporenwerk-source.zip -d source
          test -f source/sporenwerk-wildwuchs/build.gradle
          test -f source/sporenwerk-wildwuchs/src/main/resources/META-INF/mods.toml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Apply Sporenwerk 1.69.0 gameplay, UI, and resource patches
        run: |
          set -euo pipefail
          cp tools/polish_sources.py tools/generate_art.py tools/add_daemmerling.py tools/add_skill_tree.py tools/add_questline.py tools/add_localization.py tools/add_machine_visuals.py tools/harden_machine_io.py tools/add_machine_geometry.py tools/add_compost_and_machine_status.py tools/make_art_preview.py tools/fix_advancement_schemas.py tools/complete_machine_farming_loop.py tools/add_infection_system.py tools/add_mutation_containment.py tools/add_reversible_infection.py tools/add_containment_endgame.py tools/add_mutagen_research.py tools/add_mutagen_harvest.py tools/add_mutagen_phenotypes.py tools/add_field_scanner.py tools/add_visible_mutagen_fields.py tools/test_visible_mutagen_fields.py tools/add_spore_filter.py tools/test_spore_filter.py tools/add_mutagen_blooms.py tools/test_mutagen_blooms.py tools/add_spore_ward.py tools/test_spore_ward.py tools/add_filter_maintenance.py tools/add_mutagen_field_station.py tools/test_mutagen_field_station.py tools/add_mutagen_field_contrast.py tools/test_mutagen_field_contrast.py tools/add_mutagen_station_comparator.py tools/test_mutagen_station_comparator.py tools/add_mutagen_warning_siren.py tools/test_mutagen_warning_siren.py tools/add_mutagen_siren_severity.py tools/add_mutagen_siren_latch.py tools/test_mutagen_siren_latch.py tools/add_kristallpirscher.py tools/test_kristallpirscher.py tools/add_kristallpirscher_resonance.py tools/test_kristallpirscher_resonance.py tools/add_mutagen_resonance_dampener.py tools/test_mutagen_resonance_dampener.py tools/add_resonance_dampener_feedback.py tools/test_resonance_dampener_feedback.py tools/add_kristallpirscher_resonance_shards.py tools/test_kristallpirscher_resonance_shards.py tools/add_mutagen_dampener_projection.py tools/test_mutagen_dampener_projection.py tools/add_mutagen_dampener_charge.py tools/test_mutagen_dampener_charge.py tools/add_mutagen_dampener_counterpulse.py tools/test_mutagen_dampener_counterpulse.py tools/add_mutagen_bloom_ward_synergy.py tools/test_mutagen_bl