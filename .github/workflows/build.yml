name: Build Sporenwerk for Forge 1.20.1

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Download uploaded Sporenwerk source package
        env:
          SOURCE_ZIP_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3J3eAXO0JHxk99nxUaTru8I5NJp/0b4b8767-5e8f-4950-9492-a656af59a87e.zip
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_ZIP_URL" --output /tmp/sporenwerk-source.zip
          unzip -t /tmp/sporenwerk-source.zip
          mkdir source
          unzip -q /tmp/sporenwerk-source.zip -d source
          test -f source/sporenwerk-wildwuchs/build.gradle
          test -f source/sporenwerk-wildwuchs/src/main/resources/META-INF/mods.toml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Apply fixes for the verified Forge 1.20.1 compiler errors
        working-directory: source/sporenwerk-wildwuchs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Forge 47.x for Minecraft 1.20.1 uses the three-argument storage overload.
          p = Path("src/main/java/de/sporenwerk/skill/SkillData.java")
          s = p.read_text(encoding="utf-8")
          s = s.replace("import net.minecraft.util.datafix.DataFixTypes;", "")
          s = s.replace("    private static final Factory<SkillData> FACTORY = new Factory<>(SkillData::new, SkillData::load, DataFixTypes.LEVEL);", "")
          old = 'return level.getServer().overworld().getDataStorage().computeIfAbsent(FACTORY, "sporenwerk_progression");'
          new = 'return level.getServer().overworld().getDataStorage().computeIfAbsent(SkillData::load, SkillData::new, "sporenwerk_progression");'
          if old in s:
              s = s.replace(old, new, 1)
          if new not in s or "Factory<SkillData>" in s:
              raise SystemExit("Could not apply legacy computeIfAbsent fix")
          p.write_text(s, encoding="utf-8")

          # BlockEntity coordinates are obtained from getBlockPos(), not a local 'pos' variable.
          p = Path("src/main/java/de/sporenwerk/block/entity/MachineBlockEntity.java")
          s = p.read_text(encoding="utf-8")
          for old, new in [
              ("BlockPos.betweenClosed(pos.offset(-2, -1, -2), pos.offset(2, 1, 2))",
               "BlockPos.betweenClosed(getBlockPos().offset(-2, -1, -2), getBlockPos().offset(2, 1, 2))"),
              ("target.equals(pos)", "target.equals(getBlockPos())"),
          ]:
              if old in s:
                  s = s.replace(old, new)
          if "BlockPos.betweenClosed(pos.offset(" in s or "target.equals(pos)" in s:
              raise SystemExit("Could not apply MachineBlockEntity position fix")
          p.write_text(s, encoding="utf-8")

          # Forge/Minecraft 1.20.1 exposes AMBIENT_CAVE as a Holder reference.
          p = Path("src/main/java/de/sporenwerk/client/ClientHorrorEvents.java")
          s = p.read_text(encoding="utf-8")
          s = s.replace("SoundEvents.AMBIENT_CAVE,", "SoundEvents.AMBIENT_CAVE.value(),")
          if "SoundEvents.AMBIENT_CAVE," in s:
              raise SystemExit("Could not apply cave sound holder fix")
          p.write_text(s, encoding="utf-8")
          print("Applied 3 compiler fixes from GitHub Actions build 39931193028.")
          PY

      - name: Validate resources
        working-directory: source/sporenwerk-wildwuchs
        run: python3 tools/validate_resources.py

      - name: Build mod
        working-directory: source/sporenwerk-wildwuchs
        run: gradle --no-daemon clean build

      - name: Verify installable mod JAR
        working-directory: source/sporenwerk-wildwuchs
        run: |
          set -euo pipefail
          test -s build/libs/sporenwerk-1.0.0.jar
          jar tf build/libs/sporenwerk-1.0.0.jar | grep -q 'META-INF/mods.toml'

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: sporenwerk-1.0.0-forge-1.20.1
          path: source/sporenwerk-wildwuchs/build/libs/sporenwerk-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
