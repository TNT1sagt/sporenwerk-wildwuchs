          jar tf build/libs/sporenwerk-1.69.0.jar | grep -q 'assets/sporenwerk/textures/block/mutagenfeld_stabilisator_side.png'
          jar tf build/libs/sporenwerk-1.69.0.jar | grep -q 'data/sporenwerk/recipes/mutagenfeld_stabilisator.json'
          jar tf build/libs/sporenwerk-1.69.0.jar | grep -q 'data/sporenwerk/advancements/recipes/misc/mutagenfeld_stabilisator.json'
          jar tf build/libs/sporenwerk-1.69.0.jar | grep -q 'data/sporenwerk/recipes/sporenfilterwartungstisch.json'
          jar tf build/libs/sporenwerk-1.69.0.jar | grep -q 'data/sporenwerk/recipes/sporenfiltereinsatz_mutagen.json'
          jar tf build/libs/sporenwerk-1.69.0.jar | grep -q 'data/sporenwerk/advancements/recipes/misc/sporenfiltereinsatz_mutagen.json'
          jar tf build/libs/sporenwerk-1.69.0.jar | grep -q 'assets/sporenwerk/textures/block/sporenfilterwartungstisch_top.png'

      - name: Smoke-test dedicated server startup without optional mods
        working-directory: source/sporenwerk-wildwuchs
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          : > run/server.properties
          rm -f /tmp/sporenwerk-server.log
          # Start the server in its own process group and stop immediately after readiness.
          setsid timeout --signal=TERM --kill-after=10s 180s gradle --no-daemon runServer > /tmp/sporenwerk-server.log 2>&1 &
          server_pid=$!
          deadline=$((SECONDS + 150))
          ready=0
          while (( SECONDS < deadline )); do
            if grep -Fq 'Done (' /tmp/sporenwerk-server.log 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          cat /tmp/sporenwerk-server.log
          if [ "$ready" -ne 1 ]; then
            kill -TERM -- "-$server_pid" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            echo "Dedicated server did not reach the Done line within 150 seconds."
            exit 1
          fi
          if grep -Eq 'Parsing error loading custom advancement|Couldn.t load advancement sporenwerk:' /tmp/sporenwerk-server.log; then
            echo 'Invalid Sporenwerk advancement data was reported during startup.'
            exit 1
          fi
          # Startup is the test; don't leave the server process alive for 210 extra seconds.
          kill -TERM -- "-$server_pid" 2>/dev/null || true
          sleep 2
          kill -KILL -- "-$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true

      - name: Package optional FTB Quests import
        run: |
          set -euo pipefail
          test -s source/sporenwerk-wildwuchs/extras/ftbquests/config/ftbquests/quests/chapters/sporenwerk_wildwuchs.snbt
          mkdir -p packages
          cp -R source/sporenwerk-wildwuchs/extras/ftbquests/. packages/
          cd packages
          zip -qr "$GITHUB_WORKSPACE/sporenwerk-ftbquests-import-1.20.1.zip" .
          unzip -t "$GITHUB_WORKSPACE/sporenwerk-ftbquests-import-1.20.1.zip"

