name: Build Sporenwerk 1.1.8 for Forge 1.20.1

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout workflow and polish scripts
        uses: actions/checkout@v4

      - name: Download initial Sporenwerk source snapshot
        env:
          SOURCE_ZIP_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3J3eAXO0JHxk99nxUaTru8I5NJp/0b4b8767-5e8f-4950-9492-a656af59a87e.zip
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_ZIP_URL" --output /tmp/sporenwerk-source.zip
          unzip -t /tmp/sporenwerk-source.zip
          mkdir source
          unzip -q /tmp/sporenwerk-source.zip -d source
          test -f source/sporenwerk-wildwuchs/build.gradle
          test -f source/sporenwerk-wildwuchs/src/main/resources/META-INF/mods.toml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Apply V1.0.1 gameplay, GUI, and art update
        run: |
          set -euo pipefail
          cp tools/polish_sources.py tools/generate_art.py tools/add_daemmerling.py tools/add_skill_tree.py tools/add_questline.py tools/add_localization.py tools/add_machine_visuals.py tools/harden_machine_io.py source/sporenwerk-wildwuchs/tools/
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 source/sporenwerk-wildwuchs/tools/polish_sources.py source/sporenwerk-wildwuchs
          python3 source/sporenwerk-wildwuchs/tools/add_daemmerling.py source/sporenwerk-wildwuchs
          python3 source/sporenwerk-wildwuchs/tools/add_skill_tree.py source/sporenwerk-wildwuchs
          python3 source/sporenwerk-wildwuchs/tools/add_questline.py source/sporenwerk-wildwuchs
          python3 source/sporenwerk-wildwuchs/tools/add_localization.py source/sporenwerk-wildwuchs
          python3 source/sporenwerk-wildwuchs/tools/add_machine_visuals.py source/sporenwerk-wildwuchs
          python3 source/sporenwerk-wildwuchs/tools/harden_machine_io.py source/sporenwerk-wildwuchs
          python3 source/sporenwerk-wildwuchs/tools/test_machine_io_contract.py source/sporenwerk-wildwuchs

      - name: Validate machine automation and energy boundaries
        working-directory: source/sporenwerk-wildwuchs
        run: python3 tools/test_machine_io_contract.py

      - name: Validate JSON, textures, and model references
        working-directory: source/sporenwerk-wildwuchs
        run: python3 tools/validate_resources.py

      - name: Build mod with ForgeGradle
        working-directory: source/sporenwerk-wildwuchs
        run: gradle --no-daemon clean build

      - name: Verify installable mod JAR
        working-directory: source/sporenwerk-wildwuchs
        run: |
          set -euo pipefail
          test -s build/libs/sporenwerk-1.1.8.jar
          jar tf build/libs/sporenwerk-1.1.8.jar | grep -q 'META-INF/mods.toml'
          jar tf build/libs/sporenwerk-1.1.8.jar | grep -q 'de/sporenwerk/client/menu/MachineScreen.class'
          jar tf build/libs/sporenwerk-1.1.8.jar | grep -q 'assets/sporenwerk/textures/item/feldhandbuch.png'
          jar tf build/libs/sporenwerk-1.1.8.jar | grep -q 'assets/sporenwerk/lang/en_us.json'
          jar tf build/libs/sporenwerk-1.1.8.jar | grep -q 'de/sporenwerk/item/MachineBlockItem.class'
          jar tf build/libs/sporenwerk-1.1.8.jar | grep -q 'de/sporenwerk/item/WurzelkonzentratItem.class'
          jar tf build/libs/sporenwerk-1.1.8.jar | grep -q 'assets/sporenwerk/textures/item/wurzelkonzentrat.png'
          jar tf build/libs/sporenwerk-1.1.8.jar | grep -q 'data/sporenwerk/recipes/wurzelkonzentrat.json'
          jar tf build/libs/sporenwerk-1.1.8.jar | grep -q 'de/sporenwerk/client/menu/SkillTreeScreen.class'
          jar tf build/libs/sporenwerk-1.1.8.jar | grep -q 'assets/sporenwerk/textures/block/feldsammler_side.png'
          jar tf build/libs/sporenwerk-1.1.8.jar | grep -q 'assets/sporenwerk/textures/block/saatgutpresse_top.png'
          jar tf build/libs/sporenwerk-1.1.8.jar | grep -q 'assets/sporenwerk/textures/block/biomasse_bioreaktor_back.png'
          jar tf build/libs/sporenwerk-1.1.8.jar | grep -q 'de/sporenwerk/entity/DaemmerlingEntity.class'
          jar tf build/libs/sporenwerk-1.1.8.jar | grep -q 'de/sporenwerk/item/VerwitterteNotizItem.class'
          jar tf build/libs/sporenwerk-1.1.8.jar | grep -q 'data/sporenwerk/advancements/field_behind_glass.json'

      - name: Smoke-test dedicated server startup without optional mods
        working-directory: source/sporenwerk-wildwuchs
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout --signal=TERM --kill-after=15s 210s gradle --no-daemon runServer > /tmp/sporenwerk-server.log 2>&1
          server_status=$?
          set -e
          cat /tmp/sporenwerk-server.log
          grep -E 'Done \(' /tmp/sporenwerk-server.log
          if [ "$server_status" -ne 0 ] && [ "$server_status" -ne 124 ] && [ "$server_status" -ne 143 ]; then
            exit "$server_status"
          fi

      - name: Package optional FTB Quests import
        run: |
          set -euo pipefail
          test -s source/sporenwerk-wildwuchs/extras/ftbquests/config/ftbquests/quests/chapters/sporenwerk_wildwuchs.snbt
          mkdir -p packages
          cp -R source/sporenwerk-wildwuchs/extras/ftbquests/. packages/
          cd packages
          zip -qr "$GITHUB_WORKSPACE/sporenwerk-ftbquests-import-1.20.1.zip" .
          unzip -t "$GITHUB_WORKSPACE/sporenwerk-ftbquests-import-1.20.1.zip"

      - name: Upload optional FTB Quests import
        uses: actions/upload-artifact@v4
        with:
          name: sporenwerk-ftbquests-import-1.20.1
          path: sporenwerk-ftbquests-import-1.20.1.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: sporenwerk-1.1.8-forge-1.20.1
          path: source/sporenwerk-wildwuchs/build/libs/sporenwerk-1.1.8.jar
          if-no-files-found: error
          retention-days: 14
