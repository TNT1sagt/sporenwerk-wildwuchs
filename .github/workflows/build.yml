name: Build Sporenwerk 1.6.0 for Forge 1.20.1

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: sporenwerk-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout workflow and polish scripts
        uses: actions/checkout@v4

      - name: Download initial Sporenwerk source snapshot
        env:
          SOURCE_ZIP_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3J3eAXO0JHxk99nxUaTru8I5NJp/0b4b8767-5e8f-4950-9492-a656af59a87e.zip
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_ZIP_URL" --output /tmp/sporenwerk-source.zip
          unzip -t /tmp/sporenwerk-source.zip
          mkdir source
          unzip -q /tmp/sporenwerk-source.zip -d source
          test -f source/sporenwerk-wildwuchs/build.gradle
          test -f source/sporenwerk-wildwuchs/src/main/resources/META-INF/mods.toml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Apply Sporenwerk 1.6.0 gameplay, UI, and resource patches
        run: |
          set -euo pipefail
          cp tools/polish_sources.py tools/generate_art.py tools/add_daemmerling.py tools/add_skill_tree.py tools/add_questline.py tools/add_localization.py tools/add_machine_visuals.py tools/harden_machine_io.py tools/add_machine_geometry.py tools/add_compost_and_machine_status.py tools/make_art_preview.py tools/fix_advancement_schemas.py tools/complete_machine_farming_loop.py tools/add_infection_system.py tools/add_mutation_containment.py tools/add_reversible_infection.py tools/add_containment_endgame.py source/sporenwerk-wildwuchs/tools/
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 source/sporenwerk-wildwuchs/tools/polish_sources.py source/sporenwerk-wildwuchs
          python3 source/sporenwerk-wildwuchs/tools/add_daemmerling.py source/sporenwerk-wildwuchs
          python3 source/sporenwerk-wildwuchs/tools/add_skill_tree.py source/sporenwerk-wildwuchs
          python3 source/sporenwerk-wildwuchs/tools/add_questline.py source/sporenwerk-wildwuchs
          python3 source/sporenwerk-wildwuchs/tools/add_localization.py source/sporenwerk-wildwuchs
          python3 source/sporenwerk-wildwuchs/tools/add_machine_visuals.py source/sporenwerk-wildwuchs
          python3 source/sporenwerk-wildwuchs/tools/harden_machine_io.py source/sporenwerk-wildwuchs
          python3 source/sporenwerk-wildwuchs/tools/add_machine_geometry.py source/sporenwerk-wildwuchs
          python3 source/sporenwerk-wildwuchs/tools/add_compost_and_machine_status.py source/sporenwerk-wildwuchs
          python3 source/sporenwerk-wildwuchs/tools/fix_advancement_schemas.py source/sporenwerk-wildwuchs
          python3 source/sporenwerk-wildwuchs/tools/complete_machine_farming_loop.py source/sporenwerk-wildwuchs
          python3 source/sporenwerk-wildwuchs/tools/add_infection_system.py source/sporenwerk-wildwuchs
          python3 source/sporenwerk-wildwuchs/tools/add_mutation_containment.py source/sporenwerk-wildwuchs
          python3 source/sporenwerk-wildwuchs/tools/add_reversible_infection.py source/sporenwerk-wildwuchs
          python3 source/sporenwerk-wildwuchs/tools/add_containment_endgame.py source/sporenwerk-wildwuchs
          python3 source/sporenwerk-wildwuchs/tools/test_machine_io_contract.py source/sporenwerk-wildwuchs

      - name: Validate machine automation and energy boundaries
        working-directory: source/sporenwerk-wildwuchs
        run: python3 tools/test_machine_io_contract.py

      - name: Validate farming loop and optional integrations
        working-directory: source/sporenwerk-wildwuchs
        run: python3 tools/test_crop_loop.py

      - name: Validate automated collector residue transaction
        working-directory: source/sporenwerk-wildwuchs
        run: python3 tools/test_machine_farming_loop.py .

      - name: Validate Dämmerling balance and crop protection
        working-directory: source/sporenwerk-wildwuchs
        run: python3 tools/test_daemmerling_behavior.py .

      - name: Validate infection choices and persistent endgame state
        working-directory: source/sporenwerk-wildwuchs
        run: python3 tools/test_infection_system.py .

      - name: Validate mutation perks and containment fields
        working-directory: source/sporenwerk-wildwuchs
        run: python3 tools/test_mutation_containment.py .

      - name: Validate reversible terrain infection and local restoration
        working-directory: source/sporenwerk-wildwuchs
        run: python3 tools/test_reversible_infection.py .

      - name: Validate endgame sterilization and controlled reintroduction
        working-directory: source/sporenwerk-wildwuchs
        run: python3 tools/test_containment_endgame.py .

      - name: Validate JSON, textures, and model references
        working-directory: source/sporenwerk-wildwuchs
        run: python3 tools/validate_resources.py

      - name: Create visual QA sheet
        working-directory: source/sporenwerk-wildwuchs
        run: python3 tools/make_art_preview.py .

      - name: Build mod with ForgeGradle
        working-directory: source/sporenwerk-wildwuchs
        run: gradle --no-daemon clean build

      - name: Verify installable mod JAR
        working-directory: source/sporenwerk-wildwuchs
        run: |
          set -euo pipefail
          test -s build/libs/sporenwerk-1.6.0.jar
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'META-INF/mods.toml'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'de/sporenwerk/client/menu/MachineScreen.class'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'assets/sporenwerk/textures/item/feldhandbuch.png'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'assets/sporenwerk/lang/en_us.json'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'de/sporenwerk/item/MachineBlockItem.class'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'de/sporenwerk/item/WurzelkonzentratItem.class'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'assets/sporenwerk/textures/item/wurzelkonzentrat.png'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'data/sporenwerk/recipes/wurzelkonzentrat.json'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'de/sporenwerk/client/menu/SkillTreeScreen.class'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'assets/sporenwerk/textures/block/feldsammler_side.png'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'assets/sporenwerk/textures/block/saatgutpresse_top.png'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'assets/sporenwerk/textures/block/biomasse_bioreaktor_back.png'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'assets/sporenwerk/models/block/feldsammler.json'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'assets/sporenwerk/models/block/saatgutpresse.json'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'assets/sporenwerk/models/block/biomasse_bioreaktor.json'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'assets/sporenwerk/textures/block/feldsammler_panel.png'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'assets/sporenwerk/textures/block/saatgutpresse_panel.png'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'assets/sporenwerk/textures/block/biomasse_bioreaktor_panel.png'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'de/sporenwerk/entity/DaemmerlingEntity.class'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'de/sporenwerk/entity/DaemmerlingEntity\$CropThreatGoal.class'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'de/sporenwerk/item/VerwitterteNotizItem.class'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'de/sporenwerk/item/MyzelkompostItem.class'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'assets/sporenwerk/textures/item/myzelkompost.png'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'data/sporenwerk/advancements/compost_loop.json'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'assets/sporenwerk/textures/gui/machine_interface.png'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'assets/sporenwerk/textures/gui/skilltree_interface.png'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'data/sporenwerk/advancements/field_behind_glass.json'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'de/sporenwerk/infection/InfectionEvents.class'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'de/sporenwerk/infection/InfectionWorldData.class'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'de/sporenwerk/item/InfectionSerumItem.class'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'de/sporenwerk/item/InfectionEmbraceItem.class'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'de/sporenwerk/item/SterileCoreItem.class'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'de/sporenwerk/block/MutationNodeBlock.class'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'de/sporenwerk/block/MutationAnchorBlock.class'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'de/sporenwerk/infection/MutationField.class'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'de/sporenwerk/block/InfestedTerrainBlock.class'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'de/sporenwerk/block/entity/InfestedTerrainBlockEntity.class'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'de/sporenwerk/infection/MutationAnchorData.class'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'de/sporenwerk/infection/MutationNodeData.class'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'assets/sporenwerk/textures/block/mutagen_boden.png'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'data/sporenwerk/recipes/infektionsherd.json'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'data/sporenwerk/recipes/mutationsanker.json'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'data/sporenwerk/recipes/sporenresistenter_block.json'
          jar tf build/libs/sporenwerk-1.6.0.jar | grep -q 'data/sporenwerk/recipes/steriler_kern.json'

      - name: Smoke-test dedicated server startup without optional mods
        working-directory: source/sporenwerk-wildwuchs
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          : > run/server.properties
          rm -f /tmp/sporenwerk-server.log
          # Start the server in its own process group and stop immediately after readiness.
          setsid timeout --signal=TERM --kill-after=10s 180s gradle --no-daemon runServer > /tmp/sporenwerk-server.log 2>&1 &
          server_pid=$!
          deadline=$((SECONDS + 150))
          ready=0
          while (( SECONDS < deadline )); do
            if grep -Fq 'Done (' /tmp/sporenwerk-server.log 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          cat /tmp/sporenwerk-server.log
          if [ "$ready" -ne 1 ]; then
            kill -TERM -- "-$server_pid" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            echo "Dedicated server did not reach the Done line within 150 seconds."
            exit 1
          fi
          if grep -Eq 'Parsing error loading custom advancement|Couldn.t load advancement sporenwerk:' /tmp/sporenwerk-server.log; then
            echo 'Invalid Sporenwerk advancement data was reported during startup.'
            exit 1
          fi
          # Startup is the test; don't leave the server process alive for 210 extra seconds.
          kill -TERM -- "-$server_pid" 2>/dev/null || true
          sleep 2
          kill -KILL -- "-$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true

      - name: Package optional FTB Quests import
        run: |
          set -euo pipefail
          test -s source/sporenwerk-wildwuchs/extras/ftbquests/config/ftbquests/quests/chapters/sporenwerk_wildwuchs.snbt
          mkdir -p packages
          cp -R source/sporenwerk-wildwuchs/extras/ftbquests/. packages/
          cd packages
          zip -qr "$GITHUB_WORKSPACE/sporenwerk-ftbquests-import-1.20.1.zip" .
          unzip -t "$GITHUB_WORKSPACE/sporenwerk-ftbquests-import-1.20.1.zip"

      - name: Upload optional FTB Quests import
        uses: actions/upload-artifact@v4
        with:
          name: sporenwerk-ftbquests-import-1.20.1
          path: sporenwerk-ftbquests-import-1.20.1.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload visual QA sheet
        uses: actions/upload-artifact@v4
        with:
          name: sporenwerk-1.6.0-art-preview
          path: source/sporenwerk-wildwuchs/qa-output/sporenwerk-art-preview.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: sporenwerk-1.6.0-forge-1.20.1
          path: source/sporenwerk-wildwuchs/build/libs/sporenwerk-1.6.0.jar
          if-no-files-found: error
          retention-days: 14
